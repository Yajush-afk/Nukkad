[project]
name = "nukkad"
version = "0.1.0"
description = "Local AI neighbourhood discovery quests"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
  "fastapi>=0.115", "uvicorn>=0.34", "httpx>=0.28", "pydantic>=2.10",
  "platformdirs>=4.3", "osmnx>=2.0,<3", "networkx>=3.4", "astral>=3.2",
  "cairosvg>=2.7", "cairocffi>=1.7", "python-multipart>=0.0.20",
]

[project.scripts]
nukkad = "nukkad.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nukkad"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
